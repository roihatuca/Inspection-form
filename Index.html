<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טופס בדיקת בטיחות מגרש משחקים — ת״י 1498</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
  :root {
    --primary: #1a3a5c; --primary-light: #2d5f8a; --accent: #e8a020;
    --danger: #c0392b; --warning: #e67e22; --caution: #b8860b;
    --ok: #27ae60; --bg: #f5f7fa; --card: #ffffff; --border: #d0d7e0;
    --text: #1a2332; --text-light: #5a6a7e; --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* ===== SETUP ===== */
  #setup-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 20px; }
  .setup-header { text-align:center; margin-bottom:24px; }
  .setup-header h1 { font-size:24px; font-weight:800; color:var(--primary); margin-bottom:4px; }
  .setup-header p { color:var(--text-light); font-size:13px; }
  .setup-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; width:100%; max-width:800px; margin-bottom:16px; }
  .setup-card h2 { font-size:15px; font-weight:700; color:var(--primary); margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--border); }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-group { display:flex; flex-direction:column; gap:3px; }
  .form-group.full-width { grid-column:1/-1; }
  .form-group label { font-size:11px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:0.3px; }
  .form-group input, .form-group select, .form-group textarea { border:1.5px solid var(--border); border-radius:6px; padding:8px 10px; font-family:'Heebo',sans-serif; font-size:13px; color:var(--text); background:white; outline:none; transition:border-color 0.15s; }
  .form-group input:focus, .form-group select:focus { border-color:var(--primary-light); }

  /* Standard selector */
  .std-selector { display:flex; gap:10px; margin-bottom:4px; }
  .std-btn { flex:1; padding:14px 12px; border:2px solid var(--border); border-radius:10px; cursor:pointer; font-family:'Heebo',sans-serif; font-size:13px; font-weight:600; background:white; color:var(--text); transition:all 0.15s; text-align:center; }
  .std-btn .std-icon { font-size:24px; display:block; margin-bottom:4px; }
  .std-btn .std-year { font-size:11px; color:var(--text-light); }
  .std-btn.selected { border-color:var(--primary); background:#f0f6ff; color:var(--primary); }
  .std-btn.selected .std-year { color:var(--primary-light); }

  /* Inspection type selector */
  .insp-type-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .insp-type-btn { padding:6px 14px; border:1.5px solid var(--border); border-radius:20px; cursor:pointer; font-family:'Heebo',sans-serif; font-size:13px; background:white; color:var(--text); transition:all 0.15s; }
  .insp-type-btn.selected { background:var(--primary); border-color:var(--primary); color:white; }

  /* Equipment grid */
  .eq-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; }
  .eq-option { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; background:#fafbfc; transition:all 0.15s; }
  .eq-option.active { border-color:var(--primary-light); background:#f0f6ff; }
  .eq-option-header { display:flex; align-items:center; gap:8px; flex:1; }
  .eq-letter { width:26px; height:26px; background:var(--primary); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; }
  .eq-label { font-size:12px; font-weight:500; }
  .eq-counter { display:flex; align-items:center; gap:5px; flex-shrink:0; }
  .counter-btn { width:26px; height:26px; border:none; border-radius:50%; font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s; line-height:1; }
  .counter-btn.plus { background:var(--primary); color:white; }
  .counter-btn.minus { background:#dce3ec; color:var(--text); }
  .counter-val { width:24px; text-align:center; font-weight:700; font-size:15px; color:var(--primary); }
  .generate-btn { width:100%; max-width:800px; padding:14px; background:var(--primary); color:white; border:none; border-radius:var(--radius); font-family:'Heebo',sans-serif; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; transition:background 0.15s; }
  .generate-btn:hover { background:var(--primary-light); }

  /* ===== MAIN FORM ===== */
  #main-form { display:none; }
  .form-topbar { background:var(--primary); color:white; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .form-topbar h1 { font-size:14px; font-weight:700; }
  .topbar-actions { display:flex; gap:6px; }
  .topbar-btn { padding:6px 12px; border-radius:6px; border:1.5px solid rgba(255,255,255,0.4); background:transparent; color:white; font-family:'Heebo',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
  .topbar-btn:hover { background:rgba(255,255,255,0.15); }
  .topbar-btn.accent { background:var(--accent); border-color:var(--accent); }
  .tabs-bar { background:white; border-bottom:2px solid var(--border); padding:0 16px; display:flex; gap:0; overflow-x:auto; -webkit-overflow-scrolling:touch; position:sticky; top:45px; z-index:99; }
  .tab-btn { padding:10px 14px; border:none; background:none; font-family:'Heebo',sans-serif; font-size:12px; font-weight:500; color:var(--text-light); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap; transition:all 0.15s; }
  .tab-btn:hover { color:var(--primary); }
  .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:700; }
  .tab-content { display:none; padding:16px; max-width:1100px; margin:0 auto; }
  .tab-content.active { display:block; }

  /* Cards */
  .section-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
  .section-card-header { background:var(--primary); color:white; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
  .section-card-header h3 { font-size:13px; font-weight:700; }
  .toggle-icon { font-size:14px; transition:transform 0.2s; }
  .section-card-header.collapsed .toggle-icon { transform:rotate(-90deg); }
  .section-card-body.collapsed { display:none; }
  .info-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .info-card h3 { font-size:14px; font-weight:700; color:var(--primary); margin-bottom:12px; padding-bottom:6px; border-bottom:2px solid var(--border); }

  /* Checklist table */
  .checklist-table { width:100%; border-collapse:collapse; font-size:12px; }
  .checklist-table thead tr { background:#f0f4f8; }
  .checklist-table th { padding:7px 5px; text-align:center; font-weight:700; font-size:11px; color:var(--text-light); border-bottom:1.5px solid var(--border); }
  .checklist-table th.desc-th { text-align:right; padding-right:8px; }
  .check-row td { padding:6px 5px; border-bottom:1px solid #eef0f3; vertical-align:middle; }
  .check-row:hover { background:#f8fafe; }
  .check-row.critical-row { border-right:3px solid var(--danger); }
  .check-row.severe-row { border-right:3px solid var(--warning); }
  .check-row.minor-row { border-right:3px solid #d4ac0d; }
  .num-cell { text-align:center; font-weight:600; font-size:10px; color:var(--text-light); width:32px; }
  .sev-cell { text-align:center; width:28px; font-size:13px; }
  .desc-cell { text-align:right; padding-right:8px !important; }
  .std-cell { font-size:10px; color:var(--text-light); white-space:nowrap; padding-left:6px; }
  .radio-cell { text-align:center; width:32px; }
  .radio-cell input[type="radio"] { width:14px; height:14px; cursor:pointer; accent-color:var(--primary); }
  .subheader-row td { background:#e8eef5; padding:6px 10px; font-weight:700; font-size:11px; color:var(--primary); border-bottom:1px solid var(--border); }
  .notes-row td { padding:5px 8px; background:#fefdf8; }
  .notes-row span { font-size:10px; font-weight:700; color:var(--text-light); margin-left:6px; }
  .notes-input { width:calc(100% - 44px); border:1px solid var(--border); border-radius:4px; padding:3px 7px; font-family:'Heebo',sans-serif; font-size:11px; outline:none; }
  .notes-input:focus { border-color:var(--primary-light); }
  .hidden-row { display:none; }

  /* Equipment header */
  .equipment-tab-header { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%); color:white; padding:14px 16px; margin-bottom:14px; border-radius:var(--radius); display:flex; align-items:center; gap:12px; }
  .eq-icon-big { width:40px; height:40px; background:rgba(255,255,255,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex-shrink:0; }
  .equipment-tab-header h2 { font-size:15px; font-weight:800; }
  .equipment-tab-header p { font-size:11px; opacity:0.8; }

  .equipment-info-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:14px; }
  .equipment-info-card h4 { font-size:12px; font-weight:700; color:var(--primary); margin-bottom:10px; }
  .info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; margin-bottom:12px; }

  /* Image upload */
  .image-upload-area { border:2px dashed var(--border); border-radius:8px; padding:16px; text-align:center; cursor:pointer; background:#fafbfc; position:relative; overflow:hidden; transition:all 0.2s; }
  .image-upload-area:hover { border-color:var(--primary-light); background:#f0f6ff; }
  .image-upload-area input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2; }
  .image-upload-area .upload-icon { font-size:24px; margin-bottom:4px; }
  .image-upload-area p { font-size:11px; color:var(--text-light); }
  .image-preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:6px; margin-top:8px; }
  .preview-img-wrap { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; background:#eee; }
  .preview-img-wrap img { width:100%; height:100%; object-fit:cover; }
  .remove-img { position:absolute; top:3px; right:3px; width:18px; height:18px; background:rgba(0,0,0,0.6); color:white; border:none; border-radius:50%; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* Findings */
  .findings-section { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:14px; }
  .findings-section h4 { font-size:12px; font-weight:700; color:var(--primary); margin-bottom:10px; }
  .add-finding-btn { padding:7px 14px; background:transparent; border:1.5px solid var(--primary-light); border-radius:6px; color:var(--primary-light); font-family:'Heebo',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; }
  .add-finding-btn:hover { background:var(--primary); color:white; border-color:var(--primary); }
  .finding-card { border:1.5px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; background:#fafbfc; }
  .finding-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .finding-number { font-weight:700; font-size:12px; color:var(--primary); }
  .remove-finding { border:none; background:none; color:var(--danger); cursor:pointer; font-size:16px; line-height:1; padding:0 3px; }
  .finding-severity-btns { display:flex; gap:5px; margin-bottom:7px; }
  .sev-btn { padding:3px 9px; border-radius:20px; border:1.5px solid var(--border); cursor:pointer; font-family:'Heebo',sans-serif; font-size:11px; font-weight:600; background:white; transition:all 0.15s; }
  .sev-btn[data-sev="critical"].selected { background:var(--danger); border-color:var(--danger); color:white; }
  .sev-btn[data-sev="severe"].selected { background:var(--warning); border-color:var(--warning); color:white; }
  .sev-btn[data-sev="minor"].selected { background:#d4ac0d; border-color:#d4ac0d; color:white; }

  /* OLD STANDARD table */
  .old-std-table { width:100%; border-collapse:collapse; font-size:12px; }
  .old-std-table th { background:#f0f4f8; padding:7px 8px; text-align:right; font-size:11px; font-weight:700; color:var(--text-light); border-bottom:1.5px solid var(--border); }
  .old-std-table td { padding:7px 8px; border-bottom:1px solid #eef0f3; vertical-align:top; }
  .old-std-table tr:hover td { background:#f8fafe; }
  .old-std-table .topic-cell { font-weight:700; color:var(--text); white-space:nowrap; }
  .old-std-table .subtopic-cell { color:var(--text-light); font-size:11px; }
  .old-std-table .std-ref { font-size:10px; color:var(--primary-light); white-space:nowrap; }
  .old-std-result { display:flex; gap:4px; }
  .old-std-radio { display:flex; align-items:center; gap:3px; font-size:10px; white-space:nowrap; }
  .old-std-radio input { width:12px; height:12px; accent-color:var(--primary); }
  .old-std-textarea { width:100%; border:1px solid var(--border); border-radius:4px; padding:4px 7px; font-family:'Heebo',sans-serif; font-size:11px; outline:none; resize:vertical; min-height:28px; }

  /* Summary */
  .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .summary-stat { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; text-align:center; }
  .summary-stat .stat-num { font-size:28px; font-weight:800; margin-bottom:3px; }
  .summary-stat .stat-label { font-size:11px; color:var(--text-light); font-weight:600; }
  .summary-stat.critical .stat-num { color:var(--danger); }
  .summary-stat.severe .stat-num { color:var(--warning); }
  .summary-stat.minor .stat-num { color:#b8860b; }
  .conclusion-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
  .conclusion-card h3 { font-size:14px; font-weight:700; color:var(--primary); margin-bottom:12px; }
  .conclusion-options { display:flex; flex-direction:column; gap:8px; }
  .conclusion-option { display:flex; align-items:flex-start; gap:8px; padding:10px; border:2px solid var(--border); border-radius:8px; cursor:pointer; transition:all 0.15s; }
  .conclusion-option:has(input:checked) { border-color:var(--primary); background:#f0f6ff; }
  .conclusion-option label { cursor:pointer; font-size:12px; font-weight:500; }
  .conclusion-option input[type="radio"] { margin-top:2px; accent-color:var(--primary); flex-shrink:0; }
  .signature-section { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
  .signature-section h3 { font-size:14px; font-weight:700; color:var(--primary); margin-bottom:12px; }
  .signature-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  /* Attendees / doc tables */
  .attendees-table, .doc-table { width:100%; border-collapse:collapse; }
  .attendees-table th, .doc-table th { background:#f0f4f8; padding:7px 8px; text-align:right; font-size:11px; font-weight:700; color:var(--text-light); border-bottom:1.5px solid var(--border); }
  .attendees-table td, .doc-table td { padding:5px 7px; border-bottom:1px solid var(--border); }
  .attendees-table input, .doc-table input[type="text"], .doc-table input[type="date"] { border:none; background:transparent; font-family:'Heebo',sans-serif; font-size:12px; width:100%; outline:none; }
  .attendees-table input:focus, .doc-table input:focus { background:#f0f6ff; border-radius:3px; }
  .doc-table input[type="checkbox"] { width:auto; cursor:pointer; }

  /* Inspection type banner */
  .insp-type-banner { background:#f0f6ff; border:1.5px solid var(--primary-light); border-radius:8px; padding:8px 12px; margin-bottom:14px; font-size:12px; color:var(--primary); font-weight:600; display:flex; align-items:center; gap:6px; }

  .mixed-columns { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px) { .mixed-columns { grid-template-columns:1fr; } }
  .mixed-col {}
  .mixed-col-header { font-size:13px; font-weight:700; padding:8px 12px; border-radius:8px 8px 0 0; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .new-std-header { background:#e8f4fd; color:#1a3a5c; border:1.5px solid #b8d9f5; }
  .old-std-header { background:#fdf4e8; color:#7a4a0a; border:1.5px solid #f5d5b8; }
  @media print {
    .form-topbar, .tabs-bar { display:none !important; }
    .tab-content { display:block !important; padding:8px; }
    body { background:white; }
    .section-card-body.collapsed { display:block !important; }
    #setup-screen { display:none !important; }
    #main-form { display:block !important; }
    .hidden-row { display:none !important; }
  }
</style>
</head>
<body>

<!-- ========== SETUP ========== -->
<div id="setup-screen">
  <div class="setup-header">
    <h1>🏗️ הגדרת טופס בדיקת בטיחות</h1>
    <p>ת״י 1498 | הגדר פרטים, סוג בדיקה ומתקנים</p>
  </div>

  <div class="setup-card">
    <h2>📋 בחר מהדורת תקן</h2>
    <div class="std-selector">
      <button class="std-btn" id="std_new" onclick="selectStd('new')">
        <span class="std-icon">🆕</span>
        תקן חדש
        <span class="std-year">2006 ואילך</span>
      </button>
      <button class="std-btn" id="std_old" onclick="selectStd('old')">
        <span class="std-icon">📜</span>
        תקן ישן
        <span class="std-year">לפני 2006</span>
      </button>
      <button class="std-btn" id="std_mixed" onclick="selectStd('mixed')">
        <span class="std-icon">🔀</span>
        שילוב תקנים
        <span class="std-year">חדש + ישן באותו אתר</span>
      </button>
    </div>
  </div>

  <div class="setup-card">
    <h2>פרטי הבדיקה</h2>
    <div class="form-grid">
      <div class="form-group"><label>תאריך הבדיקה</label><input type="date" id="s_date"></div>
      <div class="form-group"><label>שעת תחילה</label><input type="time" id="s_time_start"></div>
      <div class="form-group"><label>שם הבודק</label><input type="text" id="s_inspector_name" placeholder="שם מלא"></div>
      <div class="form-group"><label>מס׳ תעודת בודק</label><input type="text" id="s_inspector_id" placeholder="מספר תעודה"></div>
      <div class="form-group"><label>שם הלקוח / רשות</label><input type="text" id="s_client_name" placeholder="שם הלקוח"></div>
      <div class="form-group"><label>כתובת האתר</label><input type="text" id="s_site_address" placeholder="כתובת המגרש"></div>
      <div class="form-group"><label>שם / זיהוי המגרש</label><input type="text" id="s_site_name" placeholder="שם המגרש"></div>
      <div class="form-group"><label>מזג אוויר</label>
        <select id="s_weather"><option value="">בחר...</option><option>בהיר</option><option>מעונן חלקית</option><option>מעונן</option><option>קר</option><option>חם</option><option>גשום קל</option></select>
      </div>
      <div class="form-group full-width">
        <label>סוג הבדיקה</label>
        <div class="insp-type-grid" id="insp_type_btns">
          <button class="insp-type-btn" onclick="selectInspType(this,'annual')">שנתית</button>
          <button class="insp-type-btn" onclick="selectInspType(this,'monthly')">חודשית</button>
          <button class="insp-type-btn" onclick="selectInspType(this,'incident')">לאחר תקלה/תאונה</button>
          <button class="insp-type-btn" onclick="selectInspType(this,'acceptance')">בדיקת קבלה</button>
          <button class="insp-type-btn" onclick="selectInspType(this,'acceptance')">אחר</button>
        </div>
      </div>
    </div>
  </div>

  <div class="setup-card" id="eq-setup-card">
    <h2 id="eq-card-title">סוגי מתקנים באתר — הגדר כמות לכל סוג</h2>
    <!-- Single standard layout -->
    <div id="eq-single-layout">
      <div class="eq-grid" id="eq-grid"></div>
    </div>
    <!-- Mixed standard layout -->
    <div id="eq-mixed-layout" style="display:none">
      <div class="mixed-columns">
        <div class="mixed-col">
          <div class="mixed-col-header new-std-header">
            <span>🆕</span> מתקנים לפי תקן חדש (2006+)
          </div>
          <div class="eq-grid" id="eq-grid-new"></div>
        </div>
        <div class="mixed-col">
          <div class="mixed-col-header old-std-header">
            <span>📜</span> מתקנים לפי תקן ישן (לפני 2006)
          </div>
          <div class="eq-grid" id="eq-grid-old"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="generate-btn" onclick="generateForm()">▶ צור טופס בדיקה</button>
</div>

// ===== GLOBALS =====
const counts = {};
let inspectionType = 'annual';
let selectedStd = 'new';
EQUIPMENT_TYPES.forEach(eq => { counts[eq.id] = 0; });

// ===== SETUP =====
function selectStd(std) {
  selectedStd = std;
  document.getElementById('std_new').classList.toggle('selected', std==='new');
  document.getElementById('std_old').classList.toggle('selected', std==='old');
  document.getElementById('std_mixed').classList.toggle('selected', std==='mixed');
  // Reset all counts
  const allTypes = [...EQUIPMENT_TYPES, ...OLD_EQUIPMENT_TYPES];
  allTypes.forEach(eq => { counts[eq.id] = 0; });
  buildSetupGrid();
}

function selectInspType(btn, type) {
  document.querySelectorAll('.insp-type-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  inspectionType = type;
}

function buildSetupGrid() {
  const single = document.getElementById('eq-single-layout');
  const mixed = document.getElementById('eq-mixed-layout');
  
  if (selectedStd === 'mixed') {
    single.style.display = 'none';
    mixed.style.display = 'block';
    document.getElementById('eq-grid-new').innerHTML = EQUIPMENT_TYPES.map(eq => buildEqOptionHtml(eq, 'new_')).join('');
    document.getElementById('eq-grid-old').innerHTML = OLD_EQUIPMENT_TYPES.map(eq => buildEqOptionHtml(eq, 'old_')).join('');
    return;
  }
  
  single.style.display = 'block';
  mixed.style.display = 'none';
  const eqTypes = selectedStd === 'old' ? OLD_EQUIPMENT_TYPES : EQUIPMENT_TYPES;
  const grid = document.getElementById('eq-grid');
  grid.innerHTML = eqTypes.map(eq => buildEqOptionHtml(eq, '')).join('');
}

function buildEqOptionHtml(eq, gridPrefix) {
  const prefix = gridPrefix || '';
  const optId = `eqopt_${prefix}${eq.id}`;
  const countId = `count_${prefix}${eq.id}`;
  return `<div class="eq-option" id="${optId}">
      <div class="eq-option-header">
        <span class="eq-letter">${eq.letter}</span>
        <span class="eq-label">${eq.label}</span>
      </div>
      <div class="eq-counter">
        <button class="counter-btn minus" onclick="changeCount('${eq.id}','${prefix}',-1)">−</button>
        <span class="counter-val" id="${countId}">0</span>
        <button class="counter-btn plus" onclick="changeCount('${eq.id}','${prefix}',+1)">+</button>
      </div>
    </div>`;
}


function changeCount(id, prefix, delta) {
  // Support old 2-arg call without prefix (single grid)
  if (typeof prefix === 'number') { delta = prefix; prefix = ''; }
  counts[id] = Math.max(0, (counts[id]||0)+delta);
  // Update ALL visual instances of this counter (in case same id appears in both grids)
  ['', 'new_', 'old_'].forEach(p => {
    const countEl = document.getElementById('count_' + p + id);
    const optEl = document.getElementById('eqopt_' + p + id);
    if (countEl) countEl.textContent = counts[id];
    if (optEl) optEl.classList.toggle('active', counts[id] > 0);
  });
}

// ===== FORM GENERATION =====
function generateForm() {
  if (!selectedStd) { alert('אנא בחר מהדורת תקן'); return; }
  globalEquipCounter = 0; // reset sequential counter
  const siteName = document.getElementById('s_site_name').value || 'מגרש משחקים';
  const date = document.getElementById('s_date').value;
  const stdLabel = selectedStd==='new' ? 'תקן 2006+' : selectedStd==='old' ? 'תקן לפני 2006' : 'שילוב תקנים';
  document.getElementById('topbar-title').textContent = `בדיקת בטיחות — ${siteName} | ${date} | ${stdLabel}`;

  const tabsBar = document.getElementById('tabs-bar');
  const tabsContent = document.getElementById('tabs-content');
  tabsBar.innerHTML = ''; tabsContent.innerHTML = '';

  addTab('general','📋 פרטי בדיקה',tabsBar,tabsContent,buildGeneralTab());

  if (selectedStd === 'new') {
    addTab('site','א. האתר',tabsBar,tabsContent,buildSiteTab());
    EQUIPMENT_TYPES.forEach(eq => {
      const n = counts[eq.id]||0;
      for (let i=1;i<=n;i++) {
        globalEquipCounter++;
        const tabId=`${eq.id}_${i}`;
        const label = n>1?`${eq.short} ${i}`:eq.short;
        addTab(tabId,label,tabsBar,tabsContent,buildEquipmentTab(eq,i,globalEquipCounter));
      }
    });
    addTab('maint','ח. תחזוקה',tabsBar,tabsContent,buildMaintenanceTab());
  } else if (selectedStd === 'old') {
    // Old standard only
    addTab('old_site','א. האתר',tabsBar,tabsContent,buildOldSiteTab());
    OLD_EQUIPMENT_TYPES.forEach(eq => {
      const n = counts[eq.id]||0;
      for (let i=1;i<=n;i++) {
        globalEquipCounter++;
        const tabId=`${eq.id}_${i}`;
        const label = n>1?`${eq.short} ${i}`:eq.short;
        addTab(tabId,label,tabsBar,tabsContent,buildOldEquipmentTab(eq,i,globalEquipCounter));
      }
    });
    addTab('old_checks','רשימת תיוג',tabsBar,tabsContent,buildOldChecksTab());
    addTab('old_extras','תוספות נת"מ',tabsBar,tabsContent,buildOldExtrasTab());
    addTab('old_findings','פירוט ממצאים',tabsBar,tabsContent,buildOldFindingsTab());
  } else {
    // Mixed: new + old standard
    // Site checks (new std)
    addTab('site','א. האתר',tabsBar,tabsContent,buildSiteTab());
    
    // New standard equipment tabs
    let hasNew = false;
    EQUIPMENT_TYPES.forEach(eq => {
      const n = counts[eq.id]||0;
      for (let i=1;i<=n;i++) {
        hasNew = true;
        globalEquipCounter++;
        const tabId=`${eq.id}_${i}`;
        const label = n>1?`${eq.short} ${i}`:eq.short;
        addTab(tabId,'🆕 '+label,tabsBar,tabsContent,buildEquipmentTab(eq,i,globalEquipCounter));
      }
    });
    
    // Old standard equipment tabs
    let hasOld = false;
    OLD_EQUIPMENT_TYPES.forEach(eq => {
      const n = counts[eq.id]||0;
      for (let i=1;i<=n;i++) {
        hasOld = true;
        globalEquipCounter++;
        const tabId=`${eq.id}_${i}`;
        const label = n>1?`${eq.short} ${i}`:eq.short;
        addTab(tabId,'📜 '+label,tabsBar,tabsContent,buildOldEquipmentTab(eq,i,globalEquipCounter));
      }
    });
    
    // Maintenance (new std)
    addTab('maint','ח. תחזוקה',tabsBar,tabsContent,buildMaintenanceTab());
    
    // Old standard specific tabs if any old equipment selected
    if (hasOld) {
      addTab('old_checks','📜 רשימת תיוג (ישן)',tabsBar,tabsContent,buildOldChecksTab());
      addTab('old_extras','📜 תוספות נת"מ',tabsBar,tabsContent,buildOldExtrasTab());
      addTab('old_findings','📜 ממצאים (ישן)',tabsBar,tabsContent,buildOldFindingsTab());
    }
  }

  addTab('summary','📊 סיכום',tabsBar,tabsContent,buildSummaryTab());
  switchTab('general');
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('main-form').style.display='block';
  window.scrollTo(0,0);
}

function addTab(id,label,bar,content,html) {
  const btn=document.createElement('button');
  btn.className='tab-btn'; btn.id='tab_'+id; btn.textContent=label;
  btn.onclick=()=>switchTab(id); bar.appendChild(btn);
  const div=document.createElement('div');
  div.className='tab-content'; div.id='content_'+id; div.innerHTML=html;
  content.appendChild(div);
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  const b=document.getElementById('tab_'+id), c=document.getElementById('content_'+id);
  if(b)b.classList.add('active'); if(c)c.classList.add('active');
}

// ===== RENDER CHECKLIST ROWS (new std with filter) =====
function renderRows(items, prefix) {
  return items.map(item=>{
    if(!item||!item.type) return '';
    if(item.type==='subheader') return `<tr class="subheader-row"><td colspan="9">${item.text||''}</td></tr>`;
    if(item.type==='notes') return `<tr class="notes-row"><td colspan="9"><span>הערות:</span><input type="text" class="notes-input" placeholder="הזן הערות..."></td></tr>`;
    if(item.type==='item'){
      const sev=item.severity||'🟠';
      const sevClass={'🔴':'critical','🟠':'severe','🟡':'minor'}[sev]||'severe';
      const uid=`${prefix}_${item.num}`;
      // Filter by inspection type
      const itypes=item.insp_types||['acceptance'];
      // acceptance shows ALL; others filter by insp_types
      const show = inspectionType === 'acceptance' || itypes.includes('all') || itypes.includes(inspectionType);
      const rowClass = show ? `check-row ${sevClass}-row` : `check-row ${sevClass}-row hidden-row`;
      return `<tr class="${rowClass}" data-insp-types="${itypes.join(',')}">
        <td class="num-cell">${item.num||''}</td>
        <td class="sev-cell">${sev}</td>
        <td class="desc-cell">${(item.desc||'').replace(/</g,'&lt;')}</td>
        <td class="std-cell">${(item.std||'').replace(/</g,'&lt;')}</td>
        <td class="radio-cell"><input type="radio" name="${uid}" value="ok"></td>
        <td class="radio-cell"><input type="radio" name="${uid}" value="minor"></td>
        <td class="radio-cell"><input type="radio" name="${uid}" value="severe"></td>
        <td class="radio-cell"><input type="radio" name="${uid}" value="critical"></td>
        <td class="radio-cell"><input type="radio" name="${uid}" value="na"${show?' checked':''}></td>
      </tr>`;
    }
    return '';
  }).join('');
}

// ===== HELPERS =====
function toggleSection(hdr){
  hdr.classList.toggle('collapsed');
  const body=hdr.nextElementSibling;
  if(body)body.classList.toggle('collapsed');
}

function handleImages(input,previewId){
  const preview=document.getElementById(previewId);
  if(!preview)return;
  Array.from(input.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const wrap=document.createElement('div');
      wrap.className='preview-img-wrap';
      wrap.innerHTML=`<img src="${e.target.result}" alt="תמונה"><button class="remove-img" onclick="this.parentElement.remove()">✕</button>`;
      preview.appendChild(wrap);
    };
    reader.readAsDataURL(file);
  });
}

let findingCounters={};
function addFinding(prefix){
  if(!findingCounters[prefix])findingCounters[prefix]=0;
  findingCounters[prefix]++;
  const n=findingCounters[prefix];
  const container=document.getElementById(prefix+'_findings');
  const div=document.createElement('div');
  div.className='finding-card'; div.id=`${prefix}_finding_${n}`;
  div.innerHTML=`
    <div class="finding-card-header">
      <span class="finding-number">ממצא מס׳ ${n}</span>
      <button class="remove-finding" onclick="document.getElementById('${prefix}_finding_${n}').remove()">✕</button>
    </div>
    <div class="finding-severity-btns">
      <button class="sev-btn" data-sev="critical" onclick="selectSev(this)">🔴 קריטי</button>
      <button class="sev-btn" data-sev="severe" onclick="selectSev(this)">🟠 חמור</button>
      <button class="sev-btn" data-sev="minor" onclick="selectSev(this)">🟡 קל</button>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px">
      <div class="form-group"><label>סעיף בטופס</label><input type="text" placeholder="מס׳ סעיף"></div>
      <div class="form-group"><label>פעולה נדרשת</label><input type="text" placeholder="תיאור הפעולה"></div>
    </div>
    <div class="form-group" style="margin-bottom:7px">
      <label>תיאור הליקוי</label>
      <textarea rows="2" placeholder="תיאור מפורט..." style="border:1.5px solid var(--border);border-radius:6px;padding:7px;font-family:Heebo,sans-serif;font-size:11px;width:100%;outline:none;resize:vertical"></textarea>
    </div>
    <div class="image-upload-area" style="padding:10px">
      <input type="file" accept="image/*" multiple onchange="handleImages(this,'${prefix}_finding_${n}_imgs')">
      <div class="upload-icon" style="font-size:18px">📸</div><p>תמונות לממצא זה</p>
    </div>
    <div class="image-preview-grid" id="${prefix}_finding_${n}_imgs"></div>`;
  container.appendChild(div);
}

function selectSev(btn){
  btn.closest('.finding-severity-btns').querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function calcSummary(){
  let c=0,s=0,m=0;
  document.querySelectorAll('input[type="radio"]:checked').forEach(r=>{
    if(r.value==='critical')c++;
    else if(r.value==='severe')s++;
    else if(r.value==='minor')m++;
  });
  const sc=document.getElementById('sum_critical');
  const ss=document.getElementById('sum_severe');
  const sm=document.getElementById('sum_minor');
  if(sc)sc.textContent=c; if(ss)ss.textContent=s; if(sm)sm.textContent=m;
}

// Init
buildSetupGrid();
document.getElementById('s_date').value=new Date().toISOString().split('T')[0];
selectStd('new');
</script>
